<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White for woman</title>
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('bg.jpg') no-repeat center center/cover;
            background-attachment: fixed;
            padding: 20px;
        }

        /* الكارت الأبيض الشفاف */
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* تكبير اللوجو */
        .logo-container {
            margin-bottom: 12px;
        }

        .logo-container img {
            width: 125px !important;
            height: 125px !important;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: #444;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .link-btn i {
            font-size: 20px;
            width: 25px;
            text-align: left;
        }

        .btn-text {
            flex-grow: 1;
            text-align: center;
        }

        /* ألوان الأزرار */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
        }

        .btn-facebook {
            background-color: #1877F2;
            color: #ffffff;
        }

        .btn-tiktok {
            background-color: #000000;
            color: #ffffff;
        }

        /* تلوين InstaPay البنفسجي */
        .btn-instapay {
            background-color: #582583 !important;
            color: #ffffff !important;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #555;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <img src="logo.png" alt="WHITE Logo">
        </div>

        <h1 class="title">White for woman</h1>
        <p class="subtitle"> Welcome to my page</p>

        <!-- الأزرار بدون روابط خارجية -->
        <div class="links-container">

            <a href="#" class="link-btn btn-instagram">
                <i class="fa-brands fa-instagram"></i>
                <span class="btn-text">Instagram</span>
            </a>

            <a href="#" class="link-btn btn-facebook">
                <i class="fa-brands fa-facebook-f"></i>
                <span class="btn-text">Facebook</span>
            </a>

            <a href="#" class="link-btn btn-tiktok">
                <i class="fa-brands fa-tiktok"></i>
                <span class="btn-text">TikTok</span>
            </a>

            <a href="#" class="link-btn btn-instapay">
                <i class="fa-solid fa-wallet"></i>
                <span class="btn-text">InstaPay</span>
            </a>

        </div>

        <div class="footer">
            Powered by Vodoo
        </div>
    </div>

</body>
</html>
